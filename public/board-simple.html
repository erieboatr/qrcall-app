<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Live Status Board</title>
  <style>
    body {
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .header img { height: 60px; }
    .header h1 { margin: 0; font-size: 36px; }
    .header p { margin: 4px 0; color: #9ca3af; }
    .call {
      background: #1f2937;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
    }
    .bar {
      width: 8px;
      border-radius: 4px;
      margin-right: 16px;
    }
    .critical { background: #dc2626; }
    .high { background: #f97316; }
    .medium { background: #eab308; }
    .low { background: #16a34a; }
    .equip { font-size: 28px; font-weight: bold; }
    .loc { font-size: 18px; color: #d1d5db; }
    .status { font-size: 16px; margin-top: 4px; }
    .desc { margin-top: 8px; color: #d1d5db; }
    .meta { margin-left: auto; text-align: right; font-size: 14px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="header">
    <img id="logo" src="/logo.png" alt="logo">
    <div style="text-align:right">
      <h1>Live Status Board</h1>
      <p id="plant">Plant: —</p>
      <p id="onduty">On duty: Loading…</p>
    </div>
  </div>
  <div id="calls">Loading…</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabase = window.supabase.createClient(
      "https://slrxmogriwsnbondquwq.supabase.co",
      "KEY01A189199928025B46DA8DD0593BFA53_7Yp08aqMuOBp8PORkxlDjG"
    );

    const params = new URLSearchParams(window.location.search);
    const plant = params.get("plant") || "ppi";

    document.getElementById("plant").textContent = "Plant: " + plant;

    async function load() {
      // Logo
      const { data: plantData } = await supabase.from("plants").select("logo_url").eq("id", plant).maybeSingle();
      if (plantData?.logo_url) document.getElementById("logo").src = plantData.logo_url;

      // Calls
      const { data: calls } = await supabase
        .from("service_calls")
        .select("*")
        .eq("plant_id", plant)
        .in("status", ["Waiting", "Arrived", "Needs More Work"])
        .order("submitted_at", { ascending: false });

      const container = document.getElementById("calls");
      container.innerHTML = "";

      if (!calls || calls.length === 0) {
        container.innerHTML = "<p style='text-align:center;font-size:24px;color:#9ca3af'>No open service calls</p>";
        return;
      }

      calls.forEach(call => {
        const priorityClass = call.priority.toLowerCase();
        const div = document.createElement("div");
        div.className = "call";
        div.innerHTML = `
          <div class="bar ${priorityClass}"></div>
          <div>
            <div class="equip">${call.equipment_name || ""}</div>
            <div class="loc">${call.location || ""}</div>
            <div class="status">${call.priority} • ${call.status}</div>
            <div class="desc">${call.description || ""}</div>
            ${call.submitter_name ? `<div class="desc">Submitted by: ${call.submitter_name}</div>` : ""}
          </div>
          <div class="meta">
            <div>Submitted:</div>
            <div>${call.submitted_at ? new Date(call.submitted_at).toLocaleString() : ""}</div>
            ${call.arrived_at ? `<div>Arrived:<br>${new Date(call.arrived_at).toLocaleString()}</div>` : ""}
          </div>
        `;
        container.appendChild(div);
      });
    }

    load();
    setInterval(load, 15000); // refresh every 15 seconds
  </script>
</body>
</html>
