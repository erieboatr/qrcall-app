<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Live Status Board</title>
  <style>
    body {
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .header img { height: 70px; }
    .header h1 { margin: 0; font-size: 42px; }
    .header p { margin: 6px 0; color: #e5e7eb; font-size: 22px; }
    #onduty { font-size: 24px; font-weight: bold; color: #fbbf24; }
    .call {
      background: #1f2937;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
    }
    .bar {
      width: 12px;
      border-radius: 6px;
      margin-right: 20px;
    }
    .critical { background: #dc2626; }
    .high { background: #f97316; }
    .medium { background: #eab308; }
    .low { background: #16a34a; }
    .equip { font-size: 32px; font-weight: bold; }
    .loc { font-size: 22px; color: #d1d5db; margin-top: 4px; }
    .status { font-size: 22px; font-weight: bold; margin-top: 8px; color: #fbbf24; }
    .desc { margin-top: 10px; font-size: 18px; color: #d1d5db; }
    .meta { margin-left: auto; text-align: right; font-size: 16px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="header">
    <img id="logo" src="/logo.png" alt="logo">
    <div style="text-align:right">
      <h1>Live Status Board</h1>
      <p id="plant">Plant: —</p>
      <p id="onduty">On duty: Loading…</p>
    </div>
  </div>
  <div id="calls">Loading…</div>

  <script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    const client = window.supabase.createClient(
      "https://slrxmogriwsnbondquwq.supabase.co",
      "sb_publishable_mRc51Yzgz1dlCrW3oTs9iQ_ZZke2yLz"
    )

    const params = new URLSearchParams(window.location.search)
    const plant = params.get("plant") || "ppi"

    document.getElementById("plant").textContent = "Plant: " + plant

    async function load() {
      const { data: plantData } = await client.from("plants").select("logo_url").eq("id", plant).maybeSingle()
      if (plantData?.logo_url) document.getElementById("logo").src = plantData.logo_url

      const now = new Date()
      const today = now.toISOString().slice(0, 10)
      const day = now.getDay()
      const time = now.toTimeString().slice(0, 5)

      // Check overrides first
      const { data: overrideData } = await client
        .from("schedule_overrides")
        .select("technician_id, start_time, end_time, technicians(name)")
        .eq("plant_id", plant)
        .eq("override_date", today)

      const offTechIds = new Set()
      const onDutyFromOverride = []

      if (overrideData) {
        for (const row of overrideData) {
          if (!row.start_time || !row.end_time) {
            offTechIds.add(row.technician_id)
          } else if (row.start_time <= time && row.end_time >= time) {
            const name = row.technicians?.name
            if (name) onDutyFromOverride.push(name)
          }
        }
      }

      // Weekly rules, excluding anyone marked OFF
      const { data: weeklyData } = await client
        .from("schedules")
        .select("technician_id, technicians(name)")
        .eq("plant_id", plant)
        .eq("day_of_week", day)
        .lte("start_time", time)
        .gte("end_time", time)

      const weeklyNames = []
      if (weeklyData) {
        for (const row of weeklyData) {
          if (!offTechIds.has(row.technician_id)) {
            const name = row.technicians?.name
            if (name) weeklyNames.push(name)
          }
        }
      }

      const allNames = [...new Set([...onDutyFromOverride, ...weeklyNames])]
      document.getElementById("onduty").textContent = allNames.length > 0
        ? "On duty: " + allNames.join(", ")
        : "On duty: No one scheduled"

      const { data: calls } = await client
        .from("service_calls")
        .select("*")
        .eq("plant_id", plant)
        .in("status", ["Waiting", "Arrived", "Needs More Work"])
        .order("submitted_at", { ascending: false })

      const container = document.getElementById("calls")
      container.innerHTML = ""

      if (!calls || calls.length === 0) {
        container.innerHTML = "<p style='text-align:center;font-size:24px;color:#9ca3af'>No open service calls</p>"
        return
      }

      calls.forEach(call => {
        const priorityClass = (call.priority || "medium").toLowerCase()
        const div = document.createElement("div")
        div.className = "call"
        div.innerHTML = `
          <div class="bar ${priorityClass}"></div>
          <div>
            <div class="equip">${call.equipment_name || ""}</div>
            <div class="loc">${call.location || ""}</div>
            <div class="status">${call.priority || ""} • ${call.status || ""}</div>
            <div class="desc">${call.description || ""}</div>
            ${call.submitter_name ? `<div class="desc">Submitted by: ${call.submitter_name}</div>` : ""}
          </div>
          <div class="meta">
            <div>Submitted:</div>
            <div>${call.submitted_at ? new Date(call.submitted_at).toLocaleString() : ""}</div>
            ${call.arrived_at ? `<div>Arrived:<br>${new Date(call.arrived_at).toLocaleString()}</div>` : ""}
          </div>
        `
        container.appendChild(div)
      })
    }

    load()
    setInterval(load, 15000)
  </script>
</body>
</html>
